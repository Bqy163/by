<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧微型温室监控系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
        }
        
        /* 顶部导航 */
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
        }
        
        .navbar h1 {
            font-size: 18px;
            font-weight: 600;
        }
        
        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 13px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
            display: inline-block;
            margin-right: 4px;
        }
        
        .status-dot.online { background: #4CAF50; box-shadow: 0 0 5px #4CAF50; }
        .status-dot.offline { background: #f44336; }
        
        .btn-logout {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        
        /* 标签页 */
        .tabs {
            display: flex;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 0 20px;
        }
        
        .tab {
            padding: 14px 24px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-size: 14px;
            color: #666;
            transition: all 0.3s;
        }
        
        .tab:hover { color: #667eea; }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 600;
        }
        
        /* 内容区 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* 卡片 */
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #444;
        }
        
        /* 监控页面布局 */
        .monitor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }
        
        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        /* 传感器数据 */
        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .sensor-item {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .sensor-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        
        .sensor-label {
            font-size: 13px;
            color: #888;
            margin-top: 6px;
        }
        
        /* 控制面板 */
        .control-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        
        .control-item {
            text-align: center;
        }
        
        .btn-control {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-control:hover { transform: translateY(-2px); }
        .btn-control.on {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }
        
        .btn-control.off {
            background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
            color: white;
        }
        
        .control-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 6px;
        }
        
        /* 舵机控制 */
        .servo-control {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }
        
        .servo-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        
        .servo-item label {
            display: block;
            font-size: 13px;
            margin-bottom: 10px;
            color: #555;
        }
        
        .servo-item input[type="range"] {
            width: 100%;
        }
        
        .servo-value {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-top: 8px;
        }
        
        /* 历史数据 */
        .history-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .btn-time {
            padding: 8px 20px;
            border: 1px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        .btn-time:hover, .btn-time.active {
            background: #667eea;
            color: white;
        }
        
        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 20px;
        }
        
        /* 冰川识别 */
        .glacier-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .glacier-settings {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }
        
        .setting-item {
            margin-bottom: 15px;
        }
        
        .setting-item label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #555;
        }
        
        .setting-item select, .setting-item input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        
        .btn-primary:hover { opacity: 0.9; }
        
        /* 日志 */
        .log-container {
            max-height: 300px;
            overflow-y: auto;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #d4d4d4;
        }
        
        .log-item {
            padding: 3px 0;
            border-bottom: 1px solid #333;
        }
        
        @media (max-width: 768px) {
            .monitor-grid, .glacier-grid { grid-template-columns: 1fr; }
            .control-grid { grid-template-columns: repeat(2, 1fr); }
            .servo-control { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="navbar">
        <h1>🌱 智慧微型温室监控系统</h1>
        <div class="navbar-right">
            <span><span class="status-dot offline" id="esp32-dot"></span>主控</span>
            <span><span class="status-dot offline" id="cam-dot"></span>摄像头</span>
            <span id="current-time">--:--:--</span>
            <button class="btn-logout" onclick="location.href='/logout'">退出</button>
        </div>
    </div>
    
    <!-- 标签页 -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('monitor')">📹 实时监控</div>
        <div class="tab" onclick="switchTab('history')">📊 历史数据</div>
        <div class="tab" onclick="switchTab('glacier')">🧊 冰川识别</div>
        <div class="tab" onclick="switchTab('growth')">🌾 生长模型</div>
    </div>
    
    <div class="container">
        <!-- 实时监控页 -->
        <div id="tab-monitor" class="tab-content active">
            <div class="monitor-grid">
                <!-- 左侧：视频 -->
                <div class="card">
                    <div class="card-title">📹 实时监控</div>
                    <div class="video-container">
                        <img src="/video_feed" alt="实时视频流" id="video-stream">
                        <div class="video-label">ESP32-CAM 实时画面</div>
                    </div>
                </div>
                
                <!-- 右侧：环境数据 -->
                <div>
                    <div class="card">
                        <div class="card-title">📊 环境参数</div>
                        <div class="sensor-grid">
                            <div class="sensor-item">
                                <div class="sensor-value" id="temp">--</div>
                                <div class="sensor-label">温度 (°C)</div>
                            </div>
                            <div class="sensor-item">
                                <div class="sensor-value" id="humi">--</div>
                                <div class="sensor-label">湿度 (%)</div>
                            </div>
                            <div class="sensor-item">
                                <div class="sensor-value" id="light">--</div>
                                <div class="sensor-label">光照 (lux)</div>
                            </div>
                            <div class="sensor-item">
                                <div class="sensor-value" id="co2">--</div>
                                <div class="sensor-label">CO2 (ppm)</div>
                            </div>
                            <div class="sensor-item">
                                <div class="sensor-value" id="soil">--</div>
                                <div class="sensor-label">土壤湿度 (%)</div>
                            </div>
                            <div class="sensor-item">
                                <div class="sensor-value" id="update-time">--</div>
                                <div class="sensor-label">最后更新</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 设备控制 -->
            <div class="card">
                <div class="card-title">🎛️ 设备控制</div>
                <div class="control-grid">
                    <div class="control-item">
                        <button class="btn-control" id="btn-fan" onclick="toggleDevice('fan')">
                            <span class="control-icon">💨</span>
                            <span>风扇</span>
                        </button>
                    </div>
                    <div class="control-item">
                        <button class="btn-control" id="btn-light" onclick="toggleDevice('light')">
                            <span class="control-icon">💡</span>
                            <span>补光灯</span>
                        </button>
                    </div>
                    <div class="control-item">
                        <button class="btn-control" id="btn-water" onclick="toggleDevice('water')">
                            <span class="control-icon">💧</span>
                            <span>浇水</span>
                        </button>
                    </div>
                    <div class="control-item">
                        <button class="btn-control" id="btn-heater" onclick="toggleDevice('heater')">
                            <span class="control-icon">🔥</span>
                            <span>升温</span>
                        </button>
                    </div>
                </div>
                
                <div class="servo-control">
                    <div class="servo-item">
                        <label>通风窗角度</label>
                        <input type="range" min="0" max="180" value="0" id="window-slider" oninput="setServo('window', this.value)">
                        <div class="servo-value"><span id="window-val">0</span>°</div>
                    </div>
                    <div class="servo-item">
                        <label>遮阳帘角度</label>
                        <input type="range" min="0" max="180" value="0" id="shade-slider" oninput="setServo('shade', this.value)">
                        <div class="servo-value"><span id="shade-val">0</span>°</div>
                    </div>
                </div>
                
                <div style="margin-top: 15px; text-align: center;">
                    <button class="btn-control off" onclick="emergencyStop()" style="width: 200px;">
                        <span class="control-icon">🛑</span>
                        <span>紧急停止</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 历史数据页 -->
        <div id="tab-history" class="tab-content">
            <div class="card">
                <div class="card-title">📊 历史数据趋势</div>
                <div class="history-controls">
                    <button class="btn-time active" onclick="loadHistory(5, this)">近5天</button>
                    <button class="btn-time" onclick="loadHistory(10, this)">近10天</button>
                    <button class="btn-time" onclick="loadHistory(60, this)">近60天</button>
                </div>
                <div class="chart-container">
                    <canvas id="historyChart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- 冰川识别页 -->
        <div id="tab-glacier" class="tab-content">
            <div class="glacier-grid">
                <div class="card">
                    <div class="card-title">🧊 冰川识别设置</div>
                    <div class="glacier-settings">
                        <div class="setting-item">
                            <label>识别模式</label>
                            <select id="glacier-mode">
                                <option value="auto">自动识别</option>
                                <option value="manual">手动识别</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label>自动识别间隔 (天)</label>
                            <input type="number" id="glacier-interval" value="10" min="1" max="30">
                        </div>
                        <div class="setting-item">
                            <label>下次识别时间</label>
                            <input type="text" id="next-glacier-time" value="计算中..." readonly>
                        </div>
                        <button class="btn-primary" onclick="triggerGlacierRecognize()">
                            🔍 立即识别
                        </button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">📋 识别记录</div>
                    <div id="glacier-records">
                        <p style="color: #888; text-align: center; padding: 40px;">暂无识别记录</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 生长模型页 -->
        <div id="tab-growth" class="tab-content">
            <div class="card">
                <div class="card-title">🌾 作物生长模型</div>
                <p style="color: #888; text-align: center; padding: 60px;">
                    生长模型模块预留<br>
                    后续可接入作物生长预测算法
                </p>
            </div>
        </div>
    </div>
    
    <script>
        // 标签切换
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
            
            if (tabName === 'history') {
                loadHistory(5);
            }
        }
        
        // 设备状态
        let deviceStates = { fan: false, light: false, water: false, heater: false };
        
        // 更新状态
        function updateStatus() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    const sensor = data.sensor;
                    document.getElementById('temp').textContent = sensor.temperature?.toFixed(1) || '--';
                    document.getElementById('humi').textContent = sensor.humidity?.toFixed(1) || '--';
                    document.getElementById('light').textContent = sensor.light || '--';
                    document.getElementById('co2').textContent = sensor.co2 || '--';
                    document.getElementById('soil').textContent = sensor.soil_moisture?.toFixed(1) || '--';
                    
                    const updateTime = sensor.last_update ? new Date(sensor.last_update).toLocaleTimeString() : '--';
                    document.getElementById('update-time').textContent = updateTime;
                    
                    // 在线状态
                    const esp32Dot = document.getElementById('esp32-dot');
                    const camDot = document.getElementById('cam-dot');
                    
                    if (data.system.esp32_online) {
                        esp32Dot.classList.add('online');
                        esp32Dot.classList.remove('offline');
                    } else {
                        esp32Dot.classList.remove('online');
                        esp32Dot.classList.add('offline');
                    }
                    
                    if (data.system.cam_online) {
                        camDot.classList.add('online');
                        camDot.classList.remove('offline');
                    } else {
                        camDot.classList.remove('online');
                        camDot.classList.add('offline');
                    }
                    
                    // 更新按钮状态
                    if (sensor.devices) {
                        updateButtons(sensor.devices);
                    }
                })
                .catch(e => console.error('状态更新失败:', e));
        }
        
        function updateButtons(devices) {
            for (let key in devices) {
                if (key === 'window' || key === 'shade') continue;
                const btn = document.getElementById('btn-' + key);
                if (btn) {
                    if (devices[key]) {
                        btn.classList.add('on');
                        btn.classList.remove('off');
                    } else {
                        btn.classList.remove('on');
                        btn.classList.add('off');
                    }
                }
            }
            if (devices.window !== undefined) {
                document.getElementById('window-slider').value = devices.window;
                document.getElementById('window-val').textContent = devices.window;
            }
            if (devices.shade !== undefined) {
                document.getElementById('shade-slider').value = devices.shade;
                document.getElementById('shade-val').textContent = devices.shade;
            }
        }
        
        // 切换设备
        function toggleDevice(device) {
            deviceStates[device] = !deviceStates[device];
            sendControl(device, deviceStates[device]);
        }
        
        // 设置舵机
        function setServo(name, value) {
            document.getElementById(name + '-val').textContent = value;
            sendControl(name, parseInt(value));
        }
        
        // 发送控制指令
        function sendControl(key, value) {
            fetch('/api/control', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    device: 'esp32_greenhouse_01',
                    [key]: value
                })
            })
            .then(r => r.json())
            .then(data => console.log('控制成功:', data))
            .catch(e => console.error('控制失败:', e));
        }
        
        // 紧急停止
        function emergencyStop() {
            fetch('/api/control', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    device: 'esp32_greenhouse_01',
                    all_off: true
                })
            })
            .then(r => r.json())
            .then(data => {
                for (let key in deviceStates) {
                    deviceStates[key] = false;
                }
                document.querySelectorAll('.btn-control').forEach(btn => {
                    btn.classList.remove('on');
                    btn.classList.add('off');
                });
            })
            .catch(e => console.error('紧急停止失败:', e));
        }
        
        // 历史数据图表
        let historyChart = null;
        
        function loadHistory(days, btnElement) {
            if (btnElement) {
                document.querySelectorAll('.btn-time').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }
            
            fetch('/api/history?days=' + days)
                .then(r => r.json())
                .then(data => {
                    renderChart(data);
                })
                .catch(e => console.error('历史数据加载失败:', e));
        }
        
        function renderChart(data) {
            const ctx = document.getElementById('historyChart').getContext('2d');
            
            if (historyChart) {
                historyChart.destroy();
            }
            
            historyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.timestamps,
                    datasets: [
                        {
                            label: '温度 (°C)',
                            data: data.temperature,
                            borderColor: '#f44336',
                            backgroundColor: 'rgba(244,67,54,0.1)',
                            tension: 0.4
                        },
                        {
                            label: '湿度 (%)',
                            data: data.humidity,
                            borderColor: '#2196F3',
                            backgroundColor: 'rgba(33,150,243,0.1)',
                            tension: 0.4
                        },
                        {
                            label: '光照 (lux)',
                            data: data.light,
                            borderColor: '#FF9800',
                            backgroundColor: 'rgba(255,152,0,0.1)',
                            tension: 0.4,
                            yAxisID: 'y1'
                        },
                        {
                            label: 'CO2 (ppm)',
                            data: data.co2,
                            borderColor: '#4CAF50',
                            backgroundColor: 'rgba(76,175,80,0.1)',
                            tension: 0.4,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    scales: {
                        x: {
                            display: true,
                            title: { display: true, text: '时间' }
                        },
                        y: {
                            display: true,
                            title: { display: true, text: '温度/湿度' },
                            position: 'left'
                        },
                        y1: {
                            display: true,
                            title: { display: true, text: '光照/CO2' },
                            position: 'right',
                            grid: { drawOnChartArea: false }
                        }
                    }
                }
            });
        }
        
        // 冰川识别
        function triggerGlacierRecognize() {
            fetch('/api/glacier/recognize', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    alert('冰川识别已触发！');
                    loadGlacierRecords();
                })
                .catch(e => console.error('识别失败:', e));
        }
        
        function loadGlacierRecords() {
            fetch('/api/glacier/records')
                .then(r => r.json())
                .then(data => {
                    const container = document.getElementById('glacier-records');
                    if (data.length === 0) {
                        container.innerHTML = '<p style="color: #888; text-align: center; padding: 40px;">暂无识别记录</p>';
                        return;
                    }
                    
                    let html = '<table style="width: 100%; font-size: 13px;">';
                    html += '<tr style="background: #f5f5f5;"><th>时间</th><th>结果</th><th>置信度</th><th>模式</th></tr>';
                    data.forEach(r => {
                        html += `<tr><td>${r.timestamp}</td><td>${r.result}</td><td>${r.confidence}</td><td>${r.mode}</td></tr>`;
                    });
                    html += '</table>';
                    container.innerHTML = html;
                })
                .catch(e => console.error('加载记录失败:', e));
        }
        
        // 更新时间
        function updateTime() {
            document.getElementById('current-time').textContent = new Date().toLocaleTimeString();
        }
        
        // 视频流错误处理
        document.getElementById('video-stream').onerror = function() {
            setTimeout(() => {
                this.src = '/video_feed?' + Date.now();
            }, 3000);
        };
        
        // 定时刷新
        setInterval(updateStatus, 2000);
        setInterval(updateTime, 1000);
        updateStatus();
        updateTime();
    </script>
</body>
</html>
