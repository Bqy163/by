<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧微型温室 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #065f46 0%, #10b981 50%, #34d399 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            bottom: -150px;
            left: -100px;
            border-radius: 50%;
        }

        .decorative {
            position: absolute;
            font-size: 180px;
            opacity: 0.12;
            color: white;
        }
        .d1 { top: 8%; left: 6%; }
        .d2 { bottom: 12%; right: 8%; font-size: 140px; }
        .d3 { top: 30%; right: 15%; font-size: 80px; opacity: 0.1; }

        .login-card {
            background: white;
            padding: 48px 44px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            font-size: 64px;
            display: block;
            margin-bottom: 12px;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .logo h1 {
            font-size: 24px;
            color: #1f2937;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .logo p {
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
            font-weight: 500;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #9ca3af;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s;
            background: #f9fafb;
        }

        .form-group input:focus {
            outline: none;
            border-color: #10b981;
            background: white;
            box-shadow: 0 0 0 4px rgba(16,185,129,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #065f46 0%, #10b981 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
            letter-spacing: 2px;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(16,185,129,0.35);
        }

        .btn-login:active { transform: translateY(0); }

        .hint {
            margin-top: 20px;
            padding: 12px 16px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            font-size: 12.5px;
            color: #166534;
            line-height: 1.6;
            text-align: center;
        }

        .hint strong { color: #065f46; }

        .error-msg {
            color: #dc2626;
            font-size: 13px;
            margin-top: 14px;
            text-align: center;
            padding: 10px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="decorative d1">🌱</div>
    <div class="decorative d2">🪴</div>
    <div class="decorative d3">🌿</div>

    <div class="login-card">
        <div class="logo">
            <span class="logo-icon">🌱</span>
            <h1>智慧微型温室</h1>
            <p>环境监测 · 设备控制 · 病虫害识别</p>
        </div>

        <form method="POST" action="/login">
            <div class="form-group">
                <label>账号</label>
                <div class="input-wrap">
                    <span class="icon">👤</span>
                    <input type="text" name="username" placeholder="请输入账号" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label>密码</label>
                <div class="input-wrap">
                    <span class="icon">🔒</span>
                    <input type="password" name="password" placeholder="请输入密码" required>
                </div>
            </div>

            <button type="submit" class="btn-login">登 录</button>

            {% if error %}
                <div class="error-msg">⚠️ {{ error }}</div>
            {% endif %}

            <div class="hint">
                默认账号 <strong>admin</strong> / 密码 <strong>admin123</strong><br>
                请登录后及时修改管理员信息
            </div>
        </form>

        <div class="footer">© 2024 Smart Greenhouse System</div>
    </div>

</body>
</html>
